<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Exam Dashboard</title>
    <!-- Import cute, rounded fonts matching the line doodle art style -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            /* Changed background to a solid warm cream/beige tone */
            background-color: #FEDDE9;
            color: #2b2b2b; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden; /* Prevents scrollbars if the GIF peaks out */
        }

        .dashboard-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            border: 3px solid #2b2b2b;
            box-shadow: 8px 8px 0px rgba(43, 43, 43, 0.15);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            z-index: 2; /* Keeps the panel text safely layered on top */
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: #2b2b2b;
        }

        .info-group {
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(247, 243, 237, 0.8);
            border: 2px solid #2b2b2b;
            border-radius: 12px;
        }

        .info-group:last-child {
            margin-bottom: 0;
        }

        .label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7d7569;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .value {
            font-size: 17px;
            font-weight: 700;
            color: #2b2b2b;
        }

        .value.highlight {
            color: #de5246;
        }

        /* 🖼️ FLOATING GIF POSITIONING & RESIZING */
        .corner-gif {
            position: fixed;
            bottom: 20px;     /* Distance from the bottom edge */
            right: 20px;      /* Distance from the right edge */
            width: 500px;     /* 📐 ADJUST THIS VALUE to make the GIF larger or smaller */
            z-index: 1;       /* Places it cleanly behind or alongside elements */
            border-radius: 12px; /* Optional: gives the GIF soft rounded edges */
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>📝 Exam Monitor</h1>
    
    <div class="info-group">
        <span class="label">Exam Name</span>
        <span class="value" id="exam-name">{{ data.exam_name }}</span>
    </div>

    <div class="info-group">
        <span class="label">Registration Date</span>
        <span class="value" id="reg-date">{{ data.reg_date }}</span>
    </div>
    
    <div class="info-group">
        <span class="label">Exam Date</span>
        <span class="value" id="exam-date">{{ data.exam_date }}</span>
    </div>
    
    <div class="info-group">
        <span class="label">Final Deadline</span>
        <span class="value highlight" id="deadline">{{ data.deadline }}</span>
    </div>
</div>

<!-- 🖼️ THE GIF IS INSTANTIATED HERE IN THE LOWER RIGHT CORNER -->
<!-- Replace the src URL string below with your absolute GIF link -->
<img class="corner-gif" src="https://64.media.tumblr.com/904fd5e3fe559128b6001d109a688707/tumblr_od1j5dYu1F1tqd2tco2_500.gif" alt="Doodle Animation">

</body>
</html>
